name: Reynolds American
description: >-
  Reynolds American Inc. is the second-largest tobacco company in the United
  States and a subsidiary of British American Tobacco (BAT). Its subsidiaries
  include R.J. Reynolds Tobacco Company (Camel, Newport, Pall Mall), American
  Snuff Company (Grizzly, Kodiak), Santa Fe Natural Tobacco Company (Natural
  American Spirit), and R.J. Reynolds Vapor Company. Reynolds American does not
  offer a public developer API or data services.
